<head>

<style>
:root{--bg:#07162f;--bg2:#0a1f44;--card:#ffffff0d;--bd:#ffffff1f;--txt:#e8f1ff;--mut:#93a9cf;--acc:#f2c14e;--acc2:#2f6fdc;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--btn:#e0b04a;--btn-h:#ecc468;--btn-t:#0a1f44}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);min-height:100vh;
 background:radial-gradient(1000px 500px at 80% -10%,#15408a55,transparent),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{padding:1.2rem;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.4rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.25rem;margin-bottom:1rem}
.brand img{width:52px;border-radius:10px;background:#fff}.brand span b{color:var(--acc)}
nav a{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{background:#e0b04a1f;color:#fff;box-shadow:inset 0 0 0 1px #e0b04a88}
.net{margin-top:auto;font-size:.8rem;color:var(--mut)}
.net i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:.4rem}
.net.off i{background:var(--bad)}
main{padding:1.6rem;max-width:1000px;width:100%}
h1{margin:0 0 .2rem;font-size:1.7rem}.sub{color:var(--mut);margin:0 0 1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.1rem;backdrop-filter:blur(10px)}
.stat .n{font-size:1.9rem;font-weight:800;margin-top:.3rem}.stat small{color:var(--mut)}
.stat.a .n{color:var(--acc)}.stat.b .n{color:var(--ok)}
h2{font-size:1.05rem;margin:0 0 .8rem}
.bar{display:grid;grid-template-columns:100px 1fr 30px;gap:.6rem;align-items:center;margin:.5rem 0;font-size:.9rem;color:var(--mut)}
.bar div{height:10px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar div i{display:block;height:100%;border-radius:9px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;align-items:end}
label{font-size:.8rem;color:var(--mut);display:grid;gap:.25rem}
input,select{width:100%;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--bd);background:#0b1b3a;color:var(--txt);font-size:1rem}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
button,.btn{padding:.65rem 1.1rem;border:0;border-radius:8px;font-weight:600;font-size:.92rem;letter-spacing:.2px;cursor:pointer;background:var(--btn);color:var(--btn-t);transition:background .15s,box-shadow .15s}
button:hover,.btn:hover{background:var(--btn-h)}
button.sec,.btn.sec,button.del{background:transparent;color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
button.sec:hover,.btn.sec:hover,button.del:hover{background:#e0b04a22}
.list{display:grid;gap:.7rem;margin-top:1rem}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem}
.item .t{font-weight:700}.item .m{color:var(--mut);font-size:.88rem}.item .m a{color:var(--acc)}
.act{display:flex;gap:.4rem;align-items:center}
.pill{padding:.2rem .6rem;border-radius:99px;font-size:.75rem;font-weight:700}
.p-Pendiente{background:#fbbf2426;color:var(--warn)}.p-En\ proceso{background:#3b82f633;color:#93c5fd}.p-Terminado{background:#34d39926;color:var(--ok)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0 0}.chips button{padding:.4rem .8rem;font-size:.82rem;background:transparent;color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}.chips button.on{background:var(--btn);color:var(--btn-t)}
.empty{text-align:center;color:var(--mut);padding:1.5rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
@media(max-width:800px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:5;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));background:#0a1f44ee;backdrop-filter:blur(14px);border-right:0;border-top:1px solid var(--bd)}
 .brand,.net{display:none}
 nav{display:flex;width:100%;justify-content:space-around}
 nav a{flex-direction:column;gap:.1rem;font-size:.72rem;padding:.4rem .6rem}
 main{padding:1.1rem 1rem 6rem}
}
a.btn{display:inline-block;text-decoration:none;padding:.65rem 1.1rem;border-radius:8px;font-weight:600;font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:.55rem .6rem;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600}
.paper{background:#fff;color:#111;border-radius:12px;padding:1.5rem;max-width:720px}.paper th,.paper td{border-color:#ddd}.paper th{color:#555}
@media print{aside,.noprint{display:none!important}.app{display:block}body{background:#fff}main{padding:0;max-width:none}.paper{border-radius:0;max-width:none}}
/* ---- Nota PDF (nota de GitHub) ---- */
.qn{max-width:750px;padding:0;overflow:hidden;color:#111}
.qhd{background:#1e2d4a;display:flex;align-items:center;gap:16px;padding:18px 22px}
.qhd img{width:80px;height:80px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#fff}
.qhd h3{margin:0;color:#fff;font-size:20px;font-weight:900;letter-spacing:1px}
.qhd p{color:#c8d6e8;font-size:12px;margin:3px 0 0;text-transform:uppercase;letter-spacing:.5px;line-height:1.4}
.qband{background:#b8922a;text-align:center;padding:8px;color:#fff;font-weight:700;font-size:14px;letter-spacing:2px}
.qbody{padding:20px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0 16px}

.qn table{margin-top:10px;font-size:13px}
.qn th{background:#1e2d4a;color:#fff;padding:10px 8px;font-size:12px;letter-spacing:.5px;border:0}
.qn td{border:1px solid #ddd;padding:6px 8px}
.qn td input{border:none;outline:none;padding:4px;font-size:13px;margin:0;background:transparent}
.qchecks{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
.qn .qchecks label{flex-direction:row;align-items:center;gap:6px;cursor:pointer;margin:0}
.qn .qchecks input{width:18px;height:18px;padding:0;margin:0}
.qtots{margin-top:18px;border:1px solid #ddd;border-radius:8px;overflow:hidden}

.qtots div:last-child{border-bottom:0;background:#1e2d4a;color:#fff;font-size:17px;font-weight:700;padding:13px 16px}
.qbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qb{width:100%;padding:14px 18px;border:0;border-radius:8px;font-size:15px;font-weight:700;background:var(--btn);color:var(--btn-t)}.qb:hover{background:var(--btn-h)}
.qn .qb.add{width:auto;padding:10px 16px;font-size:14px;margin-top:12px}
.qft{background:#1e2d4a;color:#c8d6e8;text-align:center;padding:14px 20px;font-size:13px;font-weight:700}
.qft span{color:#f0c040}
#qModal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:999;padding:20px}
#qModal>div{background:#fff;color:#111;border-radius:14px;max-width:340px;width:100%;padding:24px;text-align:center}
#qModal .qb{margin-top:10px}
#instBtn{position:fixed;right:14px;top:14px;z-index:30;display:none;box-shadow:0 6px 18px #0006}
</style>

<div class="app">

<script>
const $=(s,r=document)=>r.querySelector(s);
function h(tag,p,...kids){const e=document.createElement(tag);for(const k in p||{}){if(k==="class")e.className=p[k];else if(k.startsWith("on"))e[k]=p[k];else e.setAttribute(k,p[k]);}kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c??"")));return e;}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(n||0);
const ESTADOS=["Pendiente","En proceso","Terminado"];
const COLOR={"Pendiente":"var(--warn)","En proceso":"#60a5fa","Terminado":"var(--ok)"};

// ---- Datos ----
const DEF={clientes:[],vehiculos:[],tecnicos:[],notas:[],horas:[],
 catalogo:[["Servicio de transmisión automática (aceite y filtro)",2200],["Reparación mayor de transmisión",15000],["Cambio de clutch",4500],["Diagnóstico de transmisión",500],["Cambio de aceite y filtro",650],["Afinación mayor",1800],["Cambio de balatas",1200],["Diagnóstico con escáner",350],["Alineación y balanceo",700]].map(([nombre,precio])=>({id:uid(),nombre,precio})),
 cfg:{nombre:"Transmisiones Automáticas González",tel:"",dir:"",folio:1,folioPdf:1}};
let D=DEF;
try{const p=JSON.parse(localStorage.getItem("technomaav_taller")||"null");if(p)D={...DEF,...p,cfg:{...DEF.cfg,...(p.cfg||{})}};}catch(e){}
if(D.cfg.nombre==="TechnoMAAV")D.cfg.nombre="Transmisiones Automáticas González";
const save=()=>{try{localStorage.setItem("technomaav_taller",JSON.stringify(D));}catch(e){}};
const cli=id=>D.clientes.find(x=>x.id===id)||{nombre:"(sin cliente)"};
const veh=id=>D.vehiculos.find(x=>x.id===id)||{placa:"(sin auto)"};
const tec=id=>D.tecnicos.find(x=>x.id===id)||{nombre:"Sin asignar"};
const tot=n=>n.items.reduce((s,i)=>s+(+i.precio||0),0);
const vtxt=v=>`${v.placa} · ${[v.marca,v.modelo,v.anio,v.color].filter(Boolean).join(" ")}`;
const fecha=d=>new Date(d).toLocaleDateString("es-MX");
const folio=n=>"N-"+String(n.folio).padStart(4,"0");
const field=(l,el)=>h("label",{},l,el);
const inp=(ph,o={})=>h("input",{placeholder:ph,...o});
const sel=(opts,f)=>h("select",{},...opts.map(o=>h("option",{value:f?f(o)[0]:o},f?f(o)[1]:o)));
const sect=(t,...k)=>h("div",{class:"card",style:"margin-top:1rem"},h("h2",{},t),...k);
const empty=t=>h("div",{class:"empty"},t);
const table=(head,rows)=>h("div",{style:"overflow-x:auto"},h("table",{},h("thead",{},h("tr",{},...head.map(x=>h("th",{},x)))),h("tbody",{},...rows.map(r=>h("tr",{},...r.map(c=>h("td",{},c)))))));
const linkA=(t,href,ext)=>h("a",{class:"btn"+(ext===2?" sec":""),href,...(ext?{target:"_blank",rel:"noopener"}:{})},t);

// ---- Mensajes ----
function msg(n){const v=veh(n.vehiculoId),c=cli(v.clienteId),t=tot(n),a=+n.anticipo||0;
 return `*${D.cfg.nombre}*\nNota de remisión ${folio(n)} - ${fecha(n.fecha)}\nCliente: ${c.nombre}\nVehículo: ${vtxt(v)}\n\n`+n.items.map(i=>`• ${i.desc}: ${money(i.precio)}`).join("\n")+`\n\n*Total: ${money(t)}*`+(a?`\nAnticipo: ${money(a)}\n*Saldo: ${money(t-a)}*`:"")+(n.garantia?`\nGarantía: ${n.garantia}`:"")+(n.obs?`\nObs: ${n.obs}`:"")+(D.cfg.tel?`\nTel: ${D.cfg.tel}`:"");}
function waLink(n){let t=(cli(veh(n.vehiculoId).clienteId).tel||"").replace(/\D/g,"");if(t.length===10)t="52"+t;return `https://wa.me/${t}?text=${encodeURIComponent(msg(n))}`;}
function mailLink(n){const c=cli(veh(n.vehiculoId).clienteId);return `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.correo||"")}&su=${encodeURIComponent(D.cfg.nombre+" - Nota "+folio(n))}&body=${encodeURIComponent(msg(n).replace(/\*/g,""))}`;}

// ---- Router ----
const views={horas,notas:notasgh,notaslocal:notapdf,notassis:notas,nota,clientes,tecnicos,catalogo,reportes,ajustes};
function go(){
  const [v,arg]=(location.hash||"#notas").slice(1).split("/");const name=views[v]?v:"notas";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===(["nota","notassis","notaslocal"].includes(name)?"notas":name)));
  $("#view").replaceChildren(views[name](arg));scrollTo(0,0);
}
addEventListener("hashchange",go);
const refresh=()=>{const y=scrollY;go();scrollTo(0,y);};

// ---- Formularios reutilizables (crear y editar) ----
function mkForm(fields,btnTxt,onSave){
  const els={};let editId=null;
  const btn=h("button",{type:"submit"},btnTxt);
  const cancel=h("button",{type:"button",class:"sec",style:"display:none",onclick:()=>reset()},"Cancelar");
  const form=h("form",{onsubmit:e=>{e.preventDefault();const o={};for(const k in els)o[k]=els[k].value.trim();onSave(o,editId);}},
    ...fields.map(([k,l,a])=>{els[k]=a&&a.opts?sel(a.opts,a.f):inp(l,a||{});return field(l,els[k]);}),btn,cancel);
  const reset=()=>{form.reset();editId=null;btn.textContent=btnTxt;cancel.style.display="none";};
  const fill=o=>{for(const k in els)els[k].value=o[k]??"";editId=o.id;btn.textContent="Actualizar";cancel.style.display="";scrollTo(0,0);};
  return{form,fill};
}
const upsert=(arr,o,id)=>{if(id)Object.assign(arr.find(x=>x.id===id),o);else arr.push({id:uid(),...o});save();refresh();};
const rowCard=(main,sub,...btns)=>h("div",{class:"card item"},h("div",{},h("div",{class:"t"},main),sub?h("div",{class:"m"},sub):""),h("div",{class:"act"},...btns));
const bEdit=fn=>h("button",{class:"sec",onclick:fn},"Editar");
const bDel=(m,fn)=>h("button",{class:"del",onclick:()=>{if(confirm(m)){fn();save();refresh();}}},"✕");
const ESP=["Transmisiones","Motor","Eléctrico","Suspensión y frenos","General"];
const pagoTxt=n=>{const t=tot(n),a=+n.anticipo||0;return n.pagada?"Pagada":a?"Saldo "+money(t-a):"Sin pago"};

// ---- Notas de remisión ----
let editNota=null;
const editar=id=>{editNota=id;if(location.hash==="#notassis")refresh();else location.hash="#notassis";};
function notas(){
  if(!D.vehiculos.length||!D.tecnicos.length)return h("div",{},h("h1",{},"Notas de remisión"),h("div",{class:"card empty"},"Antes registra un cliente con su vehículo y al menos un técnico: ",h("a",{href:"#clientes",style:"color:var(--acc)"},"Clientes y autos")," · ",h("a",{href:"#tecnicos",style:"color:var(--acc)"},"Técnicos"),". También puedes cargar datos de ejemplo en Ajustes."));
  const en=D.notas.find(x=>x.id===editNota);editNota=null;
  let items=en?en.items.map(i=>({...i})):[];
  const sv=sel(D.vehiculos,v=>[v.id,vtxt(v)+" — "+cli(v.clienteId).nombre]),st=sel(D.tecnicos,t=>[t.id,t.nombre]),se=sel(ESTADOS);
  const fa=inp("Falla reportada por el cliente"),km=inp("Km de entrada",{type:"number"}),an=inp("Anticipo (MXN)",{type:"number",min:"0"}),ga=inp("Garantía (ej. 30 días)"),obs=inp("Observaciones");
  if(en){sv.value=en.vehiculoId;st.value=en.tecnicoId;se.value=en.estado;fa.value=en.falla||"";km.value=en.km||"";an.value=en.anticipo||"";ga.value=en.garantia||"";obs.value=en.obs||"";}
  const dl=h("datalist",{id:"dl"},...D.catalogo.map(s=>h("option",{value:s.nombre})));
  const con=inp("Concepto (elige o escribe)",{list:"dl"}),pre=inp("Precio",{type:"number",min:"0",step:"0.01"});
  con.oninput=()=>{const s=D.catalogo.find(x=>x.nombre===con.value);if(s)pre.value=s.precio;};
  const box=h("div",{class:"list"}),totalEl=h("b",{style:"font-size:1.1rem"});
  const pintar=()=>{box.replaceChildren(...items.map((i,ix)=>h("div",{class:"item"},h("span",{},i.desc+" — "+money(i.precio)),h("button",{type:"button",class:"del",onclick:()=>{items.splice(ix,1);pintar();}},"✕"))));totalEl.textContent="Total: "+money(items.reduce((s,i)=>s+ +i.precio,0));};
  const add=()=>{if(!con.value.trim())return;items.push({desc:con.value.trim(),precio:+pre.value||0});con.value=pre.value="";pintar();};pintar();
  const form=h("form",{onsubmit:e=>{e.preventDefault();if(!items.length)return alert("Agrega al menos un concepto");
    const o={vehiculoId:sv.value,tecnicoId:st.value,estado:se.value,falla:fa.value.trim(),km:km.value,anticipo:+an.value||0,garantia:ga.value.trim(),obs:obs.value.trim(),items};
    const vv=D.vehiculos.find(x=>x.id===o.vehiculoId);if(o.km&&vv)vv.km=o.km;
    let n=en;if(en)Object.assign(en,o);else{n={id:uid(),folio:D.cfg.folio++,fecha:new Date().toISOString(),pagada:false,...o};D.notas.push(n);}
    save();location.hash="#nota/"+n.id;}},
    field("Vehículo",sv),field("Técnico",st),field("Estado",se),field("Falla reportada",fa),field("Km de entrada",km),field("Anticipo",an),field("Garantía",ga),field("Observaciones",obs),dl);
  const lista=h("div",{class:"list"},...(D.notas.length?[...D.notas].reverse().map(n=>{const v=veh(n.vehiculoId);
    const cambio=sel(ESTADOS);cambio.style.width="auto";cambio.value=n.estado;cambio.onchange=e=>{n.estado=e.target.value;save();refresh();};
    return h("div",{class:"card item"},
      h("div",{},h("div",{class:"t"},folio(n)+" · "+vtxt(v)),h("div",{class:"m"},cli(v.clienteId).nombre+" · "+tec(n.tecnicoId).nombre+" · "+fecha(n.fecha)+" · "+money(tot(n))+" · "+pagoTxt(n))),
      h("div",{class:"act"},cambio,h("button",{class:"sec",onclick:()=>{n.pagada=!n.pagada;save();refresh();}},n.pagada?"Pagada":"Marcar pagada"),linkA("Ver",`#nota/${n.id}`,0),bEdit(()=>editar(n.id)),bDel("¿Eliminar "+folio(n)+"?",()=>D.notas=D.notas.filter(x=>x.id!==n.id))));
  }):[empty("Aún no hay notas")]));
  return h("div",{},h("div",{class:"noprint",style:"margin-bottom:.8rem"},h("a",{class:"btn sec",href:"#notas"},"← Notas")),h("h1",{},en?"Editar nota "+folio(en):"Notas de remisión"),h("p",{class:"sub"},D.notas.length+" emitidas"),
    h("div",{class:"card"},h("h2",{},en?"Modificando "+folio(en):"Nueva nota"),form,
      h("div",{class:"row",style:"margin-top:.8rem"},con,pre,h("button",{type:"button",onclick:add},"+ Agregar concepto")),box,
      h("div",{class:"row",style:"margin-top:1rem;justify-content:space-between;align-items:center"},totalEl,h("button",{onclick:()=>form.requestSubmit()},en?"Guardar cambios":"Guardar nota"))),
    sect("Historial",lista));
}

function nota(id){
  const n=D.notas.find(x=>x.id===id);if(!n)return empty("Nota no encontrada");
  const v=veh(n.vehiculoId),c=cli(v.clienteId),t=tot(n),a=+n.anticipo||0;
  const filas=[...n.items.map(i=>[i.desc,money(i.precio)]),[h("b",{},"TOTAL"),h("b",{},money(t))]];
  if(a)filas.push(["Anticipo",money(a)],[h("b",{},"SALDO"),h("b",{},money(n.pagada?0:t-a))]);
